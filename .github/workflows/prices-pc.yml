name: Mandi prices (PC)

# Runs on your own PC (Indian internet). Every 15 min from 05:30 to 21:30 India time, hourly at night.
# Only Windows cmd + git + python are used (no Node.js actions).
on:
  schedule:
    - cron: "*/10 0-15 * * *"
    - cron: "5 16-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    steps:
      - name: Prices
        shell: cmd
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if exist work rmdir /s /q work
          git clone -q --depth 1 https://x-access-token:%TOKEN%@github.com/%GITHUB_REPOSITORY%.git work || exit /b 1
          cd work
          mkdir out
          git fetch -q --depth=1 origin data:data 2>nul && git archive -o prev.tar data prices && tar -xf prev.tar -C out
          python scripts\fetch_prices.py out || exit /b 1
          cd out
          git init -q -b data || exit /b 1
          git config core.autocrlf false
          git config user.name vavetra-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices || exit /b 1
          git commit -q -m "Prices update" || exit /b 1
          git push -q -f https://x-access-token:%TOKEN%@github.com/%GITHUB_REPOSITORY%.git data || exit /b 1
          echo Done.
