name: Monthly yard update

# 1st of every month, 08:30 India time (03:00 UTC). Can also be started by hand: Actions → Monthly yard update → Run workflow.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # New yards get a position, closed yards are removed, yards.tsv is rebuilt.
      # If Agmarknet does not answer properly nothing is changed and this run fails (GitHub e-mails you).
      - name: Update yards
        run: python scripts/update_yards.py

      - name: Save changes
        run: |
          git config user.name "vavetra-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yards.tsv yards_src.txt agmarknet_list.txt
          if git diff --cached --quiet; then
            echo "No change this month."
          else
            git commit -m "$(cat .update_summary)"
            git push
          fi
