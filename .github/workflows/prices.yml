name: Mandi prices

# Every 15 min from 05:30 to 21:30 India time, hourly at night. Can also be started by hand (Run workflow).
on:
  schedule:
    - cron: "*/15 0-15 * * *"
    - cron: "5 16-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Last run's files (to keep the night-time history between runs).
      - name: Previous prices
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data:data 2>/dev/null; then
            git archive data prices | tar -x -C out || true
          fi

      - name: Download prices
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
        run: python scripts/fetch_prices.py out

      # Branch "data" always has only ONE commit (force push), so the repo never grows.
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "vavetra-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices
          git commit -q -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
